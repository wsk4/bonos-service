apiVersion: v1
kind: Service
metadata:
  name: bonos-service
  labels:
    app: bonos-service
spec:
  type: ClusterIP          # Solo accesible dentro del clúster (no expuesto a Internet)
  selector:
    app: bonos-service
  ports:
    - name: http
      port: 8004
      targetPort: 8004
      protocol: TCP